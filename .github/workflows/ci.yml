name: CI
on: { push: { branches: [main] }, pull_request: {} }
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cc -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined -Iinclude src/aegis_parse.c tests/test_parse.c -o test
      - run: ./test
      - run: cc -O2 -Iinclude src/aegis_parse.c bench/bench.c -o bench && ./bench
