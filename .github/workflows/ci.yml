name: CI
on: { push: { branches: [main] }, pull_request: {}, schedule: [{ cron: "30 6 * * 1" }], workflow_dispatch: {} }
permissions:
  contents: read
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: cc -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined -Iinclude src/aegis_parse.c tests/test_parse.c -o test
      - run: ./test
      - run: cc -O2 -Iinclude src/aegis_parse.c bench/bench.c -o benchbin && ./benchbin
